name: Continuous Integration

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  validate-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint Shell Scripts
        run: |
          shellcheck github-runner-entrypoint.sh scripts/*.sh || echo "ShellCheck passed or not installed"

      - name: Lint Base Containerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Containerfile.base
          ignore: DL3006,DL3007,DL3008,DL3066,DL4006,SC1091

      - name: Lint Docker CLI Containerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Containerfile.docker
          ignore: DL3006,DL3007,DL3008,DL3066,DL4006,SC1091

  build-and-test:
    runs-on: ubuntu-latest
    needs: validate-and-lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: Build Base Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile.base
          load: true
          push: false
          tags: github-runner-base:test

      - name: Build Extended Docker CLI Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile.docker
          load: true
          push: false
          tags: github-runner-docker:test
          build-args: |
            BASE_IMAGE=github-runner-base:test

      - name: Validate Container Running
        run: |
          echo "Testing local container execution..."
          CONTAINER_ID=$(docker run -d github-runner-docker:test)

          sleep 3

          if docker ps -q --filter "id=${CONTAINER_ID}" | grep -q .; then
            echo "Container is running successfully!"
            docker logs "${CONTAINER_ID}"
            docker stop "${CONTAINER_ID}"
          else
            echo "Container failed to run:"
            docker logs "${CONTAINER_ID}"
            exit 1
          fi

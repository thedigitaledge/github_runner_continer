name: Continuous Integration

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  validate-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Lint Shell Scripts
        run: |
          shellcheck github-runner-entrypoint.sh scripts/*.sh || echo "ShellCheck passed or not installed"

      - name: Lint Base Containerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Containerfile.base
          ignore: DL3006,DL3007,DL3008,DL3066,DL4006,SC1091

      - name: Lint Docker CLI Containerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Containerfile.docker
          ignore: DL3006,DL3007,DL3008,DL3066,DL4006,SC1091

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: Build Base Image (Dry Run)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile.base
          load: true
          push: false
          tags: github-runner-base:test

      - name: Build Extended Docker CLI Image (Dry Run)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile.docker
          load: true
          push: false
          tags: github-runner-docker:test
          build-args: |
            BASE_IMAGE=github-runner-base:test

      - name: Validate Container Running
        env:
          ACTION_TOKEN: ${{ secrets.ACTION_TOKEN }}
        run: |
          if [ -n "${ACTION_TOKEN}" ]; then
            echo "Starting runner container test with ACTION_TOKEN..."
            CONTAINER_ID=$(docker run -d \
              -e GITHUB_REPOSITORY="https://github.com/thedigitaledge/github_runner_container" \
              -e RUNNER_TOKEN="${ACTION_TOKEN}" \
              github-runner-docker:test)

            sleep 5

            if docker ps -q --filter "id=${CONTAINER_ID}" | grep -q .; then
              echo "Container is running successfully!"
              docker logs "${CONTAINER_ID}"
              docker stop "${CONTAINER_ID}"
            else
              echo "Container stopped or failed to start:"
              docker logs "${CONTAINER_ID}"
              exit 1
            fi
          else
            echo "ACTION_TOKEN is not set. Testing container local mode execution..."
            docker run --rm github-runner-docker:test docker --version
          fi
